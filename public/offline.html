<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080B" />
    <title>Offline · Forkcast</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Plain HTML on purpose: it has to render with no network and no JS chunks. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #08080b; color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow { position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(40rem 30rem at 15% 0%, rgba(124, 58, 237, 0.18), transparent 70%),
          radial-gradient(34rem 26rem at 85% 30%, rgba(56, 189, 248, 0.12), transparent 70%); }
      .card { position: relative; width: 100%; max-width: 26rem; padding: 2.25rem 1.75rem; text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.75rem; background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 24px 60px -32px rgba(0, 0, 0, 0.9); }
      .tile { width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; display: grid; place-items: center; border-radius: 1.1rem;
        border: 1.5px solid transparent;
        background: linear-gradient(#111827, #111827) padding-box, linear-gradient(135deg, rgba(124, 58, 237, 0.7), rgba(56, 189, 248, 0.7)) border-box; }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: #a1a1aa; }
      button { margin-top: 1.75rem; width: 100%; height: 3rem; border: 0; border-radius: 999px; cursor: pointer;
        font: inherit; font-size: 0.95rem; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #7c3aed, #a855f7 50%, #38bdf8);
        box-shadow: 0 10px 30px -8px rgba(124, 58, 237, 0.75); }
      button:active { transform: scale(0.98); }
      .hint { margin-top: 0.75rem; font-size: 0.8rem; color: #71717a; }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
      <div class="tile" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <defs>
            <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#7C3AED" /><stop offset="50%" stop-color="#A855F7" /><stop offset="100%" stop-color="#38BDF8" />
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 6v7M16 6v7M22 6v7" /><path d="M10 13c0 3.6 2.7 5.6 6 5.6s6-2 6-5.6" /><path d="M16 18.6V27" />
          </g>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Forkcast needs a connection to decode menus. Your taste and past scans are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint" id="hint">This page reloads itself when you're back online.</p>
    </main>
    <script>
      window.addEventListener("online", function () {
        document.getElementById("hint").textContent = "Back online — reloading…";
        location.reload();
      });
    </script>
  </body>
</html>
